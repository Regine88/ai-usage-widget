name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PowerShell 7
            host: pwsh
          - label: Windows PowerShell 5.1
            host: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `shell:` does not accept the matrix context, so every step runs on pwsh
      # and the engine under test is invoked as a child process instead.
      - name: Version switch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & '${{ matrix.host }}' -NoProfile -ExecutionPolicy Bypass -File .\AiUsageWidget.ps1 -Version
          Write-Host $output
          if ($output -notmatch 'AI Usage Widget \d') { throw 'Unexpected -Version output' }

      - name: Offline test suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostExe = '${{ matrix.host }}'
          $tests = Get-ChildItem -Path . -Filter 'test-*.ps1' -File | Sort-Object Name
          if ($tests.Count -eq 0) { throw 'No test suites found' }
          $failed = @()
          foreach ($test in $tests) {
            Write-Host ('::group::' + $test.Name)
            $output = & $hostExe -NoProfile -ExecutionPolicy Bypass -File $test.FullName 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            Write-Host '::endgroup::'
            if ($code -ne 0 -or $output -notmatch 'ALL PASSED') {
              $failed += $test.Name
              Write-Host ('::error::{0} failed with exit code {1}' -f $test.Name, $code)
            }
          }
          if ($failed.Count -gt 0) { throw ('failed suites: ' + ($failed -join ', ')) }
          Write-Host ('{0} suite(s) passed on {1}' -f $tests.Count, '${{ matrix.label }}')

  package:
    name: Package contents
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & pwsh -NoProfile -File .\AiUsageWidget.ps1 -Version
          Write-Host $output
          $version = ([regex]::Match($output, '\d+\.\d+\.\d+')).Value
          if (-not $version) { throw 'cannot read the version from the entry script' }
          pwsh -NoProfile -File .\tools\package-release.ps1 -Version $version -OutDir dist
          pwsh -NoProfile -File .\tools\verify-package.ps1 -Version $version -OutDir dist

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Analyze
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning |
            Where-Object { $_.ScriptPath -notmatch '[\\/]dist[\\/]' })
          if (-not $results) {
            Write-Host 'PSScriptAnalyzer reported no findings'
            return
          }
          $results |
            Sort-Object Severity, ScriptName, Line |
            Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message |
            Out-String -Width 220 |
            Write-Host
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          Write-Host ('{0} finding(s); {1} error(s)' -f $results.Count, $errors.Count)
          if ($errors.Count -gt 0) { throw ('PSScriptAnalyzer errors: ' + $errors.Count) }